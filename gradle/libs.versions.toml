[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
exifinterface = "1.4.2"
material = "1.14.0"
libxposed = "102.0.0"
media3Exoplayer = "1.11.1"
